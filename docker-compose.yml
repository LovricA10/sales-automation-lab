services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales
      POSTGRES_DB: sales
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      SALES_API_DATABASE_URL: postgresql+psycopg://sales:sales@db:5432/sales
      SALES_API_JWT_SECRET: ${SALES_API_JWT_SECRET:?set SALES_API_JWT_SECRET in .env}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
